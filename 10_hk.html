  --mint:#c8f0dd;
  --rose:#ffd8cf;
  --amber:#fff3d6;
  --shadow:0 18px 40px rgba(0,0,0,.32);
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a1024;
    --surface:hsla(0,0%,100%,.07);
    --surface-2:hsla(0,0%,100%,.05);
    --ink:#ffffff;
    --muted:rgba(255,255,255,.62);
    --line:hsla(0,0%,100%,.12);
    --primary:#8ec8ff;
    --accent:#ffd08a;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:#0a1024;
  color:#fff;
  font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif
}

a{
  color:inherit
}

button{
  font:inherit
}

.serif{
  font-family:"Newsreader","Noto Sans TC",serif
}

.tabular{
  font-variant-numeric:tabular-nums
}

.glass{
  background:linear-gradient(180deg,hsla(0,0%,100%,.11),hsla(0,0%,100%,.06));
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  border:1px solid var(--line)
}

.glass-hover:hover{
  background:linear-gradient(180deg,hsla(0,0%,100%,.16),hsla(0,0%,100%,.08));
  border-color:hsla(0,0%,100%,.22);
  transform:translateY(-1px)
}

.weather-scroll{
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.25) transparent
}

.weather-scroll::-webkit-scrollbar{
  height:6px;
  width:6px
}

.weather-scroll::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.25);
  border-radius:99px
}

.card-hover{
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease
}

.card-hover:hover{
  transform:translateY(-3px)
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-7px)
  }
}

@keyframes pulseDot{
  0%{
    transform:scale(1);
    opacity:1
  }

  100%{
    transform:scale(2.2);
    opacity:0
  }
}

.floaty{
  animation:floaty 4s ease-in-out infinite
}

.live-dot{
  position:relative
}

.live-dot:before{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:99px;
  background:#26c07a;
  animation:pulseDot 1.6s ease-out infinite
}

.selection\:bg-white\/20 *::-moz-selection{
  background-color: rgb(255 255 255 / 0.2);
}

.selection\:bg-white\/20 *::selection{
  background-color: rgb(255 255 255 / 0.2);
}

.selection\:bg-white\/20::-moz-selection{
  background-color: rgb(255 255 255 / 0.2);
}

.selection\:bg-white\/20::selection{
  background-color: rgb(255 255 255 / 0.2);
}

.hover\:text-white:hover{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.disabled\:opacity-60:disabled{
  opacity: 0.6;
}

@media (min-width: 640px){
  .sm\:inline{
    display: inline;
  }

  .sm\:flex{
    display: flex;
  }

  .sm\:flex-none{
    flex: none;
  }

  .sm\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:items-center{
    align-items: center;
  }

  .sm\:p-10{
    padding: 2.5rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .sm\:text-2xl{
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-\[16px\]{
    font-size: 16px;
  }

  .sm\:text-base{
    font-size: 1rem;
    line-height: 1.5rem;
  }

  .sm\:text-sm{
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
}

@media (min-width: 768px){
  .md\:col-span-4{
    grid-column: span 4 / span 4;
  }

  .md\:col-span-8{
    grid-column: span 8 / span 8;
  }

  .md\:inline-flex{
    display: inline-flex;
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:flex-row{
    flex-direction: row;
  }

  .md\:items-center{
    align-items: center;
  }

  .md\:py-8{
    padding-top: 2rem;
    padding-bottom: 2rem;
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.35fr_1fr\]{
    grid-template-columns: 1.35fr 1fr;
  }

  .lg\:flex-row{
    flex-direction: row;
  }

  .lg\:items-end{
    align-items: flex-end;
  }
}

@media (min-width: 1280px){
  .xl\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
