  --surface-2:hsla(0,0%,100%,.92);
  --surface-border:rgba(0,0,0,.07);
  --text:#171712;
  --text-soft:#6b6a66;
  --text-faint:#9a9996;
  --accent:#d96c4a;
  --accent-2:#5b7db1;
