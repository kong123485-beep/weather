<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>東京・釜山 Live 天氣｜今日 + 未來10日</title>
<style>body{font-family:system-ui,-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;background:#f6f7fb;color:#111827;margin:0;padding:16px} .wrap{max-width:1080px;margin:auto} h1{font-size:22px;margin:6px 0} .muted{color:#6b7280;font-size:13px} .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.04)} button{border:0;border-radius:999px;padding:10px 18px;font-size:15px;cursor:pointer;background:#111827;color:#fff} .tabs{display:flex;gap:8px} .tabs button{background:#eef2f7;color:#111827} .tabs button.on{background:#111827;color:#fff} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px} .day{border:2px solid #e5e7eb;border-radius:14px;padding:12px;cursor:pointer;background:#fff} .day.today{border-color:#111827;background:#fffbeb} .day.sel{outline:3px solid #2563eb} .big{font-size:34px;font-weight:800} .pill{display:inline-block;background:#fef3c7;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700} .err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:12px;border-radius:12px;white-space:pre-wrap} code{word-break:break-all} .row{display:flex;gap:16px;flex-wrap:wrap} .row div{background:#f9fafb;border-radius:12px;padding:10px 14px}</style></head>
<body><div class="wrap">
<h1>東京・釜山 Live 天氣</h1>
<p class="muted" id="todayLine">載入中…</p>
<div class="card"><b>更新狀態：</b><span id="status">準備載入…</span><br><span class="muted" id="debug"></span><br><br>
<button onclick="load(true)">🔄 立即重新更新</button> <span class="muted">每次開頁 / 撳掣都會重新拉 Open-Meteo，唔使人手改日期。</span></div>
<div class="tabs"><button id="tab-tokyo" class="on" onclick="switchCity('tokyo')">東京 Tokyo</button><button id="tab-busan" onclick="switchCity('busan')">釜山 Busan</button>
<button onclick="toggleUnit()" id="unitBtn" style="margin-left:auto;background:#fff;color:#111827;border:1px solid #ddd">切換 °F</button></div>
<div class="card" id="hero">載入中…</div>
<div class="card"><h3 style="margin:0 0 8px">今日起 + 未來10日 · 共11日</h3><div class="grid" id="grid"></div></div>
<div class="card" id="detail"></div>
<div class="card" id="summary"></div>
<p class="muted">資料來源：Open-Meteo（免費，唔使 API key）· 如果顯示「拉唔到」，請用 Chrome / Safari 喺有網絡下直接開呢個 .html 檔，唔好喺 Meta AI 預覽入面開，預覽會擋外部 API。</p>
</div>
<script>
let unit='C', data={}, city='tokyo';
const CITIES={tokyo:{name:'東京',en:'Tokyo',lat:35.68,lon:139.69,tz:'Asia/Tokyo'},busan:{name:'釜山',en:'Busan',lat:35.18,lon:129.07,tz:'Asia/Seoul'}};
const WEEK=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function fmtT(c){return unit==='C'?Math.round(c)+'°C':Math.round(c*9/5+32)+'°F'}
function wmo(c){if(c===0)return['晴朗','☀️'];if(c<=2)return['多雲','⛅'];if(c===3)return['陰天','☁️'];if(c===45||c===48)return['有霧','🌫️'];if(c<=57)return['毛毛雨','🌦️'];if(c<=67)return['有雨','🌧️'];if(c<=77)return['有雪','🌨️'];if(c<=82)return['大雨','⛈️'];if(c>=95)return['雷暴','⛈️'];return['多雲','☁️']}
function todayISO(tz){try{return new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}}
function switchCity(c){city=c;document.getElementById('tab-tokyo').className=c==='tokyo'?'on':'';document.getElementById('tab-busan').className=c==='busan'?'on':'';render()}
function toggleUnit(){unit=unit==='C'?'F':'C';document.getElementById('unitBtn').textContent=unit==='C'?'切換 °F':'切換 °C';render()}
let selectedIdx=0;
async function load(manual){
  const now=new Date();
  document.getElementById('todayLine').textContent='今日：'+now.toLocaleDateString('zh-HK',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+' · 預報範圍：今日起 + 未來10日';
  document.getElementById('status').textContent=manual?'重新更新中…':'載入中…';
  try{
    const urls=Object.entries(CITIES).map(([k,c])=>{const u='https://api.open-meteo.com/v1/forecast?latitude='+c.lat+'&longitude='+c.lon+'&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset,weather_code&hourly=temperature_2m&timezone='+encodeURIComponent(c.tz)+'&forecast_days=11';return fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(j=>{data[k]=j})});
    await Promise.all(urls);
    document.getElementById('status').textContent='✅ 已更新：'+new Date().toLocaleString('zh-HK')+'（由 Open-Meteo 即時拉到）';
    document.getElementById('debug').textContent='東京第一日：'+data.tokyo.daily.time[0]+' · 釜山第一日：'+data.busan.daily.time[0];
    selectedIdx=0; render();
  }catch(e){
    document.getElementById('status').textContent='❌ 拉唔到 live 數據';
    document.getElementById('debug').textContent='錯誤：'+(e&&e.message?e.message:e);
    document.getElementById('hero').innerHTML='<div class="err">拉唔到 Open-Meteo。\n原因多數係：1) 冇網絡 2) 喺預覽 / in-app 瀏覽器開，佢擋咗外部 API 3) 廣告阻擋。\n解決：將呢個 .html 下載落嚟，用 Chrome / Safari 直接開，再撳「立即重新更新」。\n錯誤：'+(e&&e.message?e.message:e)+'</div>';
  }
}
function render(){
  if(!data[city])return;
  const c=CITIES[city], d=data[city].daily, h=data[city].hourly;
  const tISO=todayISO(c.tz);
  // 搵今日喺邊個 index，唔寫死
  let todayIdx=d.time.indexOf(tISO); if(todayIdx<0) todayIdx=0;
  if(selectedIdx<0||selectedIdx>=d.time.length) selectedIdx=todayIdx;
  const i=selectedIdx;
  const [wl,em]=wmo(d.weather_code[i]);
  document.getElementById('hero').innerHTML='<span class="pill">'+(i===todayIdx?'今日 · ':'')+c.name+'</span><div class="big">'+em+' '+fmtT(d.temperature_2m_max[i])+' / '+fmtT(d.temperature_2m_min[i])+'</div><div>'+d.time[i]+' '+WEEK[new Date(d.time[i]+'T12:00:00').getDay()]+' · '+wl+'</div><div class="row" style="margin-top:10px"><div>降雨機率<br><b>'+(d.precipitation_probability_max[i]??'-')+'%</b></div><div>降雨量<br><b>'+d.precipitation_sum[i]+' mm</b></div><div>風速<br><b>'+d.wind_speed_10m_max[i]+' km/h</b></div><div>日出 / 日落<br><b>'+(d.sunrise[i]||'').slice(11)+' / '+(d.sunset[i]||'').slice(11)+'</b></div></div>';
  document.getElementById('grid').innerHTML=d.time.map((iso,idx)=>{
    const [l,e2]=wmo(d.weather_code[idx]);
    return '<div class="day '+(idx===todayIdx?'today ':'')+(idx===selectedIdx?'sel ':'')+'" onclick="selectedIdx='+idx+';render()"><div><b>'+iso.slice(5)+'</b> '+WEEK[new Date(iso+'T12:00:00').getDay()]+(idx===todayIdx?' <span class="pill">今日</span>':'')+'</div><div style="font-size:22px">'+e2+' '+l+'</div><div><b>'+fmtT(d.temperature_2m_max[idx])+'</b> / '+fmtT(d.temperature_2m_min[idx])+'</div><div class="muted">雨 '+(d.precipitation_probability_max[idx]??'-')+'% · 風 '+d.wind_speed_10m_max[idx]+' km/h</div></div>';
  }).join('');
  // hourly 09 / 12 / 18
  function atHour(dayISO,hh){const ix=h.time.findIndex(t=>t.startsWith(dayISO)&&t.slice(11,13)===hh);return ix>=0?fmtT(h.temperature_2m[ix]):'-'}
  const hi=d.temperature_2m_max[i], lo=d.temperature_2m_min[i], rain=d.precipitation_probability_max[i]||0;
  let outfit=''; if(rain>=50)outfit+='帶摺遮 + 防水外套。'; if(lo<10)outfit+='厚外套 + 圍巾。'; else if(lo<15)outfit+='長袖 + 厚外套，洋蔥式穿搭。'; else if(hi>=23)outfit+='薄外套就夠。'; else outfit+='薄羽絨 / 風褸。';
  document.getElementById('detail').innerHTML='<h3 style="margin:0 0 8px">已選：'+d.time[i]+' · '+c.name+'</h3><div class="row"><div>朝早 09:00<br><b>'+atHour(d.time[i],'09')+'</b></div><div>中午 12:00<br><b>'+atHour(d.time[i],'12')+'</b></div><div>黃昏 18:00<br><b>'+atHour(d.time[i],'18')+'</b></div></div><p>👔 着衫建議：'+outfit+'</p>';
  const maxI=d.temperature_2m_max.indexOf(Math.max(...d.temperature_2m_max));
  const rainI=d.precipitation_probability_max.indexOf(Math.max(...d.precipitation_probability_max));
  const windI=d.wind_speed_10m_max.indexOf(Math.max(...d.wind_speed_10m_max));
  const avgH=(d.temperature_2m_max.reduce((a,b)=>a+b,0)/d.temperature_2m_max.length).toFixed(1);
  const avgL=(d.temperature_2m_min.reduce((a,b)=>a+b,0)/d.temperature_2m_min.length).toFixed(1);
  document.getElementById('summary').innerHTML='<h3 style="margin:0 0 8px">11 日自動總結（由 live 數據計）</h3><div>最暖：'+d.time[maxI]+' '+fmtT(d.temperature_2m_max[maxI])+' · 最濕：'+d.time[rainI]+' 降雨機率 '+(d.precipitation_probability_max[rainI]??'-')+'% · 最大風：'+d.time[windI]+' '+d.wind_speed_10m_max[windI]+' km/h · 平均：'+avgH+'°C / '+avgL+'°C（以 °C 計）</div>';
}
load(false);
</script></body></html>
